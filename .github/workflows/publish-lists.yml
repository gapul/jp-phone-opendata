name: publish-lists

# Rebuilds the caller-ID lists and replaces the contents of the `lists` release,
# which is what the app's catalogue points at.
#
# A fixed tag rather than a dated one, for two reasons: the apps are released
# separately and would otherwise claim "latest" and leave subscribers without a
# catalogue, and only one hop of patches is ever published, so keeping older
# releases would cost 1.7 GB a month for nothing.
on:
  schedule:
    # Monthly, a few days after Overture's release lands.
    - cron: "0 20 22 * *" # 05:00 JST on the 23rd
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TAG: lists

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Patches are the difference against the copy already published, so the
      # previous release has to be on disk before the build runs. Without this
      # step every subscriber would silently fall back to full downloads.
      - name: Fetch the published lists into dist/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          if gh release download "$TAG" --pattern 'places_*.bin' --pattern 'catalog.json' \
               --dir dist --clobber 2>/dev/null; then
            echo "previous release restored:"
            ls -la dist | head
          else
            echo "nothing published yet; this build will publish full lists only"
          fi

      - name: Checks
        run: |
          python3 scripts/jp_phone.py
          python3 scripts/verify_owner.py --demo
          python3 scripts/build_calldir_db.py --demo

      - name: Harvest sources
        run: |
          duckdb -c ".read scripts/extract_jp_places.sql"
          python3 scripts/fetch_places_world.py data/world
          python3 scripts/fetch_alltheplaces.py data/world
          python3 scripts/fetch_nppes_us.py data/world
          python3 scripts/fetch_mhlw_care_jp.py data/ios
          python3 scripts/fetch_kouseikyoku_iryo_jp.py data/ios
          python3 scripts/fetch_kouseikyoku_pdf_jp.py data/ios
          python3 scripts/fetch_municipal_facilities_jp.py data/ios

      - name: Build lists
        run: python3 scripts/build_calldir_db.py data/ios data/world data/suppressions dist

      # Several of these sources are scraped from sites that change without
      # warning. A silent collapse would publish a gutted list over a good one,
      # so a large drop fails the run instead.
      - name: Guard against a collapsed harvest
        run: python3 scripts/check_release.py dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/catalog.json dist/ATTRIBUTION.md dist/places_*.bin)
          # Patches only exist once something was published to diff against, so
          # the first run has none and the glob must not be passed through.
          compgen -G 'dist/*.patch' >/dev/null && assets+=(dist/*.patch)

          # Replace in place. The release is not recreated, so the download URLs
          # keep working for anyone fetching mid-run.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Lists" --notes "Rolling data release."
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md \
            --title "Lists $(date -u +%Y-%m-%d)"

          # Assets dropped from the catalogue would otherwise linger for ever.
          published=$(printf '%s\n' "${assets[@]}" | xargs -n1 basename | sort)
          gh release view "$TAG" --json assets -q '.assets[].name' | sort \
            | comm -23 - <(printf '%s\n' "$published") \
            | while read -r stale; do
                echo "removing stale asset: $stale"
                gh release delete-asset "$TAG" "$stale" --yes
              done

  # Reads what was just published back, using the app's own code, because the
  # unit tests only ever see synthetic lists and the packer only ever sees files
  # it wrote itself. This is the first thing that touches both at once.
  smoke:
    needs: publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          swiftc -O -parse-as-library \
            ios/PhoneDirectoryKit/Sources/PhoneDirectoryKit/*.swift \
            scripts/integration_check.swift -o integration_check
          ./integration_check
