name: update-data

on:
  schedule:
    - cron: "0 21 1 * *" # monthly, 1st @ 06:00 JST (MIC updates roughly monthly)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl

      - name: Regenerate dataset from MIC open data
        run: python scripts/generate.py

      - name: Commit dataset if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/prefixes.json data/import.sql data/meta.json; then
            git add data/prefixes.json data/import.sql data/meta.json
            git commit -m "chore(data): refresh MIC number allocation"
            git push
          else
            echo "no data change"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install worker deps
        working-directory: worker
        run: npm ci || npm install

      - name: Push data to D1 and deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute jp-phone --remote --file=../data/import.sql
          npx wrangler deploy
